name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  codex-review:
    name: Codex Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          echo "Diff size: $(wc -l < /tmp/pr.diff) lines"

      - name: Run Codex PR Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m cli.main pr-review --diff /tmp/pr.diff --output-dir /tmp/review

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const reviewDir = '/tmp/review';
            const files = fs.readdirSync(reviewDir).filter(f => f.endsWith('.md'));

            if (files.length === 0) {
              console.log('No review file found');
              return;
            }

            const reviewContent = fs.readFileSync(path.join(reviewDir, files[0]), 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Codex PR Review\n\n${reviewContent}\n\n---\n*Generated by [codex-sdlc-copilot](https://github.com/agaleaniket10/codex-sdlc-copilot)*`
            });
